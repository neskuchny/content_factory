<!doctype html>
<!--
  Source of docs/assets/social-preview.png (GitHub social preview, 1280x640).

  Fonts: Nunito 800 and IBM Plex Mono 500 (both SIL Open Font License 1.1, e.g. from the
  @fontsource/nunito and @fontsource/ibm-plex-mono packages). The font files are NOT part of this
  repository. To re-render, put these files in docs/assets/src/fonts/ (the paths below are
  relative to this HTML file):
    fonts/nunito-latin-800-normal.woff2
    fonts/ibm-plex-mono-latin-500-normal.woff2
  Without them the page falls back to system fonts.

  Render (Playwright, Chromium), from the repository root:
    npx playwright screenshot --viewport-size=1280,640 --wait-for-timeout=500 \
      "file://$PWD/docs/assets/src/social-preview.html" docs/assets/social-preview.png

  Palette: paper #F2F3EF, graphite #1D2026, muted #5E6670, grid #DDE1E3.
  Accent #D9480F is used only for the human decision (the third frame of the mark, "you", the underline).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Content Factory social preview</title>
<style>
  @font-face { font-family: 'Nunito'; font-weight: 800; font-style: normal;
    src: url('fonts/nunito-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; font-style: normal;
    src: url('fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }

  :root {
    --paper: #F2F3EF; --graphite: #1D2026; --muted: #5E6670; --grid: #DDE1E3; --accent: #D9480F;
    --head: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background-color: var(--paper);
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: -1px -1px;
    color: var(--graphite);
    font-family: var(--head);
    -webkit-font-smoothing: antialiased;
  }
  .card { position: absolute; inset: 0; padding: 80px 96px 0; }
  .mark { width: 192px; height: 64px; display: block; }
  h1 { font-weight: 800; font-size: 104px; line-height: 1; letter-spacing: -2px; margin-top: 36px; }
  .tag { font-weight: 800; font-size: 38px; line-height: 1.3; margin-top: 28px; max-width: 1000px; }
  .tag u { text-decoration: none; background: linear-gradient(var(--accent), var(--accent)) 0 100% / 100% 5px no-repeat; padding-bottom: 2px; }

  .route { position: absolute; left: 36px; right: 36px; top: 452px; height: 70px; }
  .route .line { position: absolute; left: 60px; right: 60px; top: 17px; border-top: 2px solid var(--graphite); }
  .route ol { list-style: none; display: flex; justify-content: space-between; position: relative; }
  .route li { display: flex; flex-direction: column; align-items: center; width: 120px; font-family: var(--mono); font-weight: 500; font-size: 19px; color: var(--muted); }
  .route .dot { width: 20px; height: 20px; border: 2.5px solid var(--graphite); border-radius: 5px; background: var(--paper); margin: 7px 0 12px; }
  .route li:last-child .dot { width: 36px; height: 36px; border: 0; border-radius: 8px; background: var(--accent); margin: 0 0 4px; display: grid; place-items: center; }
  .route li:last-child span { color: var(--graphite); }

  .stats { position: absolute; left: 96px; bottom: 44px; font-family: var(--mono); font-weight: 500; font-size: 24px; color: var(--graphite); letter-spacing: 0.2px; }
  .stats b { font-weight: 500; color: var(--muted); padding: 0 10px; }
</style>
</head>
<body>
  <div class="card">
    <!-- logo mark "three frames on a strip": two frames prepared by agents, the third one approved by you -->
    <svg class="mark" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g stroke="#1D2026" stroke-width="3" fill="none" stroke-linecap="round"><rect x="2" y="6" width="28" height="28" rx="6"/><rect x="46" y="6" width="28" height="28" rx="6"/><path d="M33 20h10M77 20h10"/></g><rect x="90" y="6" width="28" height="28" rx="6" fill="#D9480F"/><path d="M97 20.5l5 5 10-11" fill="none" stroke="#F2F3EF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Content Factory</h1>
    <p class="tag">Claude Code agents that make short-form video —<br><u>a human approves every unit</u></p>
  </div>

  <div class="route" aria-hidden="true">
    <div class="line"></div>
    <ol>
      <li><i class="dot"></i><span>brief</span></li>
      <li><i class="dot"></i><span>skeleton</span></li>
      <li><i class="dot"></i><span>harness.md</span></li>
      <li><i class="dot"></i><span>studio</span></li>
      <li><i class="dot"></i><span>QC</span></li>
      <li><i class="dot"></i><span>pack</span></li>
      <li><i class="dot"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M4 11.5l5 5 9-10" fill="none" stroke="#F2F3EF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></i><span>you</span></li>
    </ol>
  </div>

  <div class="stats">11 agents<b>·</b>19 video flows<b>·</b>guard hook<b>·</b>MIT</div>
</body>
</html>
